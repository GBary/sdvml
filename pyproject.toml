[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdvml"
version = "0.1.0"
description = "Stardew Valley mod loader for macOS that installs Vortex mod packs into SMAPI"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
sdvml = "sdvml.cli:main"

[tool.setuptools]
packages = ["sdvml"]
